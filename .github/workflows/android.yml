name: Android-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - data.enc.json
      - icons/**
      - package.json
      - capacitor.config.json
      - scripts/**
      - .github/workflows/android.yml

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Stabile Signatur, damit sich die App später über die alte installieren lässt (Daten bleiben erhalten).
      # Nur zum privaten Installieren gedacht, kein Play-Store-Schlüssel.
      - name: Debug-Schlüssel bereitstellen
        run: |
          mkdir -p ~/.android ci
          if [ ! -f ci/debug.keystore ]; then
            keytool -genkeypair -keystore ci/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=HEAL,O=HEAL,C=DE"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add ci/debug.keystore
            git commit -m "Debug-Schlüssel für stabile APK-Signatur"
            git push
          fi
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: npm install
      - run: node scripts/build-www.js
      - run: npx cap add android

      - name: Android anpassen (Berechtigungen, Icon)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' "$M"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
          for f in android/app/src/main/res/mipmap-*/ic_launcher*.png; do cp icons/icon-192.png "$f"; done
          grep -n "uses-permission" "$M"

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HEAL.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest HEAL.apk --title "HEAL für Android" --notes "Neueste Android-App. APK auf dem Handy herunterladen und öffnen, dabei Installation aus dieser Quelle erlauben." --latest
