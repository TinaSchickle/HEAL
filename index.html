<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Kopfzeile mit Countdown-Kennzahlen, darunter Tabs; jeder Tab ein Raster aus Karten. */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --ink:#12302a; --muted:#5d7770; --line:#d9e4df;
  --accent:#2c7a68; --accent-soft:#dcefe9; --warn:#a96f12; --warn-soft:#f8ecd2;
  --bad:#b5483a; --bad-soft:#f6dfda; --good:#2c7a68; --good-soft:#dcefe9; --lab:#2f6aa6; --res:#7a52a8; --ext:#b36a10;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a17; --surface:#16251f; --ink:#e3efea; --muted:#94b0a7; --line:#27403a;
  --accent:#5cc2a8; --accent-soft:#1d3a32; --warn:#e2ab52; --warn-soft:#3a2f17;
  --bad:#e5826f; --bad-soft:#3d2420; --good:#5cc2a8; --good-soft:#1d3a32; --lab:#7db2ea; --res:#b99be6; --ext:#e2ab52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a17; --surface:#16251f; --ink:#e3efea; --muted:#94b0a7; --line:#27403a;
  --accent:#5cc2a8; --accent-soft:#1d3a32; --warn:#e2ab52; --warn-soft:#3a2f17;
  --bad:#e5826f; --bad-soft:#3d2420; --good:#5cc2a8; --good-soft:#1d3a32; --lab:#7db2ea; --res:#b99be6; --ext:#e2ab52; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header{padding:36px 0 20px;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
h1{font:600 clamp(2rem,5vw,2.8rem)/1 var(--display);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:110px}
.stat b{display:block;font:600 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:24px}
nav button{font:500 .95rem var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
nav button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:600 1.35rem var(--display);margin:0 0 4px}
h3.sec{font:600 .8rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.lead{color:var(--muted);margin:0 0 20px;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{font:600 1.05rem var(--body);margin:0 0 6px}
.meta{font-size:.82rem;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0 4px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:18px}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin:3px 0}
.lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
.card p{margin:0}
.big{font:600 3.4rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* Termine */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .d{font:600 .85rem var(--body);font-variant-numeric:tabular-nums}
.tl li.past{opacity:.5}
@media (max-width:520px){.tl li{grid-template-columns:1fr auto}.tl .d{grid-column:1/-1}}
/* Phasen */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.ph{border-radius:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);font-size:.78rem;min-width:0}
.ph b{display:block;font-size:.85rem} .ph.now{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:640px){.phases{grid-template-columns:1fr 1fr}}
/* Charts / Werte */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .pt{fill:var(--ink);font-weight:600}
.val{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.val b{font:600 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.val small{color:var(--muted);font-size:.85rem}
.range{position:relative;height:12px;border-radius:99px;background:var(--bad-soft);margin:18px 0 6px}
.range .ref{position:absolute;top:0;bottom:0;background:var(--good);opacity:.3;border-radius:99px}
.range .opt{position:absolute;top:0;bottom:0;background:var(--good);opacity:.8;border-radius:99px}
.range .mark{position:absolute;top:-4px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.spark{width:100%;height:60px;display:block;margin-top:10px;overflow:visible}
.hist{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px;font-variant-numeric:tabular-nums}
.hist td{padding:3px 0;border-top:1px solid var(--line)} .hist td:last-child{text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
/* To-do */
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.step input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.step.done span{text-decoration:line-through;color:var(--muted)}
/* Recherche */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.col>h3{font:600 .8rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
.col .card{margin-bottom:12px}
.q{font:600 1.05rem/1.3 var(--display);margin:0 0 8px}
.ev{display:flex;gap:4px;align-items:center}
.ev i{width:14px;height:6px;border-radius:3px;background:var(--line)} .ev i.on{background:var(--accent)} .ev.risiko i.on{background:var(--bad)}
.lock{min-height:80vh;display:grid;place-items:center}.lock form{display:grid;gap:10px;width:min(100%,320px)}.lock input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}.lock button{font:600 .95rem var(--body);padding:10px;border-radius:8px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}/* Normwerte mit Quellen */
.src{--c:var(--muted)} .src.labor{--c:var(--lab)} .src.recherche{--c:var(--res)} .src.extern{--c:var(--ext)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.lanes{position:relative;margin:14px 0 4px;padding-top:16px}
.lane{margin:9px 0}
.lh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:.75rem;margin-bottom:3px}
.lh .rng{font-variant-numeric:tabular-nums;color:var(--ink)}
.lh .ok{font-weight:700}
.tr{position:relative;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bd{position:absolute;top:0;bottom:0;background:var(--c)}
.bd.referenz{opacity:.4} .bd.ok{opacity:.6} .bd.optimal{opacity:1}
.bd.offen-r{border-radius:0}
.mk{position:absolute;top:12px;bottom:16px;width:2px;background:var(--ink);transform:translateX(-50%);pointer-events:none;z-index:2}
.mk b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;background:var(--ink);color:var(--bg);padding:0 5px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lh .rng{position:relative;z-index:3;background:var(--surface);padding:0 3px;border-radius:3px}
.axis{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:16px}
.lg{display:inline-flex;gap:6px;align-items:center}
.lg i{width:22px;height:8px;border-radius:4px;background:var(--lab)}
.src-row{display:flex;gap:6px;align-items:center}
.card.nah{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dot{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.dot:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.dot.rot{--c:var(--bad)} .dot.gelb{--c:var(--warn)} .dot.gruen{--c:var(--good)}
.dot .lb{font-weight:500;color:var(--muted)}
.vals{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.mail{font-variant-numeric:tabular-nums;user-select:all;word-break:break-all}
.day-head{display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.day-head .bar{flex:1;min-width:160px;margin:0}
.antwort{width:100%;margin:2px 0 8px 27px;max-width:calc(100% - 27px);font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;resize:vertical}
.dtl{display:block;font-size:.82rem;color:var(--muted)}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div class="lock" id="lock"><form id="lockForm"><h1>HEAL</h1><label for="pw" class="meta">Passwort</label><input id="pw" type="password" autocomplete="current-password" autofocus required><button type="submit">Öffnen</button><p class="meta" id="lockMsg" role="alert"></p></form></div>
<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>HEAL</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <p class="foot">Keine Diagnose, ersetzt keine ärztliche Beratung. Viele Aussagen beruhen auf Abstracts, nicht auf Volltexten. Studien beschreiben Gruppen, nicht die Person.</p>
</div>

<script>
let D = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem("heal:"+k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem("heal:"+k, JSON.stringify(v)) } catch {} }
};
const DAY = 864e5;
const dt = s => new Date(s + "T12:00:00");
const today = () => { const n = new Date(); n.setHours(12,0,0,0); return n; };
const daysTo = s => Math.round((dt(s) - today()) / DAY);
const fmtDate = s => dt(s).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
const fmtShort = s => dt(s).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
const num = n => String(n).replace(".", ",");
const ampelPill = a => a==="gut"?"":a==="warn"?"warn":a==="bad"?"bad":"mute";
/* Bewertung nur nach eigenen Zielwerten (Quelle "recherche"), nie nach Laborreferenz */
function rate(normen, v){
  const R = normen.filter(n=>n.typ==="recherche");
  const ok = R.filter(n=>n.stufe==="ok"), opt = R.filter(n=>n.stufe==="optimal");
  if(!R.length) return ["keine eigenen Zielwerte","mute"];
  if(v==null) return ["nicht gemessen","mute"];
  if(opt.some(n=>inRange(v,n))) return ["im Optimum",""];
  const dir = arr => { const lo=Math.min(...arr.map(n=>n.min??-Infinity)), hi=Math.max(...arr.map(n=>n.max??Infinity)); return v<lo?"unter":v>hi?"über":""; };
  if(ok.some(n=>inRange(v,n))){ const d=opt.length?dir(opt):""; return [d?"ok, "+d+" Optimum":"ok","warn"]; }
  if(ok.length){ const d=dir(ok); return [(d||"außerhalb")+" ok","bad"]; }
  return [(dir(opt)||"außerhalb")+" Optimum","warn"];
}
const ratePill = (normen, v) => { const [t,c] = rate(normen, v); return `<span class="pill ${c}">${esc(t)}</span>`; };

const done = new Set(store.get("done", []));
let tab = (location.hash||"#uebersicht").slice(1);
const TABS = [["uebersicht","Übersicht"],["daily","Daily Plan"],["symptome","Symptome"],["supplemente","Supplemente"],["plan","Mein Plan"],["arzt","Arzt"],["werte","Werte"],["recherche","Recherche"],["wissen","Wissensbasis"],["personen","Personen"]];

function currentPhase(){
  const t = today();
  return D.plan.phasen.find(p => t >= dt(p.von) && t <= dt(p.bis)) || null;
}
function nextTermine(n){
  const t = today();
  return D.plan.termine.filter(x => dt(x.ende||x.start) >= t).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,n);
}
function termineList(list){
  const t = today();
  return `<ul class="tl">${list.map(x=>{
    const past = dt(x.ende||x.start) < t;
    const d = fmtShort(x.start) + (x.ende ? "–"+fmtShort(x.ende) : "");
    const st = x.status==="gebucht"?"": x.status==="Frist"?"bad" : x.status==="geplant"?"mute":"warn";
    return `<li class="${past?"past":""}"><span class="d">${d}</span><span>${esc(x.titel)}<br><span class="meta">${esc(x.typ)}</span></span><span class="pill ${st}">${esc(x.status)}</span></li>`;
  }).join("")}</ul>`;
}

/* ---------- TSH-Diagramm ---------- */
function tshChart(){
  const T = D.tsh, W = 640, H = 270, L = 38, R = 16, Tp = 18, B = 34;
  const ds = T.verlauf.map(p => dt(p.datum).getTime());
  const x0 = ds[0] - 60*DAY, x1 = ds[ds.length-1] + 60*DAY, ymax = 12;
  const X = t => L + (t-x0)/(x1-x0)*(W-L-R), Y = v => H-B-(v/ymax)*(H-B-Tp);
  const path = T.verlauf.map((p,i)=>(i?"L":"M")+X(ds[i]).toFixed(1)+" "+Y(p.wert).toFixed(1)).join(" ");
  const yt = [0,2,4,6,8,10,12];
  const years = [2024,2025,2026].map(y=>new Date(y+"-01-01T12:00:00").getTime()).filter(t=>t>=x0&&t<=x1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="TSH-Verlauf 2024 bis 2026">
    <rect x="${L}" y="${Y(T.referenz.max).toFixed(1)}" width="${W-L-R}" height="${(Y(T.referenz.min)-Y(T.referenz.max)).toFixed(1)}" fill="var(--lab)" opacity=".16"/>
    <rect x="${L}" y="${Y(T.opt[1]).toFixed(1)}" width="${W-L-R}" height="${(Y(T.opt[0])-Y(T.opt[1])).toFixed(1)}" fill="var(--res)" opacity=".4"/>
    ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${Y(T.okBis).toFixed(1)}" y2="${Y(T.okBis).toFixed(1)}" stroke="var(--res)" stroke-width="1.5" stroke-dasharray="2 3"/>
    <line x1="${L}" x2="${W-R}" y1="${Y(T.grenze).toFixed(1)}" y2="${Y(T.grenze).toFixed(1)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-R}" y="${(Y(T.grenze)-6).toFixed(1)}" text-anchor="end" style="fill:var(--bad)">Behandlungsgrenze ETA: 10</text>
    <text x="${W-R}" y="${(Y(T.referenz.max)-5).toFixed(1)}" text-anchor="end" style="fill:var(--lab)">Labor-Referenz ${num(T.referenz.min)}–${num(T.referenz.max)}</text>
    <text x="${W-R}" y="${(Y(T.okBis)-5).toFixed(1)}" text-anchor="end" style="fill:var(--res)">Eigene Recherche: ok bis ${num(T.okBis)}</text>
    <text x="${L+6}" y="${(Y(T.opt[1])-4).toFixed(1)}" style="fill:var(--res)">optimal ${num(T.opt[0])}–${num(T.opt[1])}</text>
    ${years.map(t=>`<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="${H-B}" y2="${H-B+5}" stroke="var(--muted)"/><text x="${X(t).toFixed(1)}" y="${H-B+18}" text-anchor="middle">${new Date(t).getFullYear()}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${T.verlauf.map((p,i)=>`<circle cx="${X(ds[i]).toFixed(1)}" cy="${Y(p.wert).toFixed(1)}" r="${i===ds.length-1?6:4}" fill="${i===ds.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2.2"/>
      <text class="pt" x="${X(ds[i]).toFixed(1)}" y="${(Y(p.wert)-11).toFixed(1)}" text-anchor="middle">${num(p.wert)}</text>`).join("")}
  </svg>`;
}

/* ---------- Normwerte mit Herkunft ---------- */
const STUFE = {referenz:"Referenz", ok:"ok", optimal:"optimal"};
const fmtN = n => num(+Number(n).toFixed(2));
const rangeTxt = n => n.orig ? n.orig : (n.min==null ? "bis "+fmtN(n.max) : n.max==null ? "ab "+fmtN(n.min) : fmtN(n.min)+"–"+fmtN(n.max));
const inRange = (v,n) => (n.min==null||v>=n.min) && (n.max==null||v<=n.max);
const labFor = d => d >= "2026-01-01" ? "Bioscientia" : "Praxis Königsbach-Stein";
function lanes(normen, value, einheit){
  if(!normen.length) return "";
  const nums = normen.flatMap(n=>[n.min,n.max]).filter(x=>x!=null).concat(value!=null?[value]:[]);
  let lo = Math.min(...nums), hi = Math.max(...nums); const span = (hi-lo)||1;
  lo = Math.max(0, lo-span*0.06); hi = hi+span*0.08;
  const pc = x => Math.max(0, Math.min(100, (x-lo)/(hi-lo)*100));
  const order = {labor:0, recherche:1, extern:2}, so = {referenz:0, ok:1, optimal:2};
  const sorted = [...normen].sort((a,b)=>(order[a.typ]-order[b.typ])||(so[a.stufe]-so[b.stufe]));
  return `<div class="lanes">
    ${value!=null?`<div class="mk" style="left:${pc(value)}%"><b>${fmtN(value)}</b></div>`:""}
    ${sorted.map(n=>{
      const a = n.min==null?0:pc(n.min), b = n.max==null?100:pc(n.max);
      const st = value==null ? "" : inRange(value,n) ? '<span class="ok" style="color:var(--good)">✓</span>' : '<span class="ok" style="color:var(--bad)">✗</span>';
      return `<div class="lane src ${n.typ}"><div class="lh"><span class="src-row"><span class="chip">${n.typ==="labor"?"Labor":n.typ==="recherche"?"Eigene Recherche":esc(n.typ)}</span><span class="meta">${esc(n.typ==="labor"?n.quelle:STUFE[n.stufe])}${n.typ==="labor"?" · "+STUFE[n.stufe]:""}</span></span>
        <span class="rng">${esc(rangeTxt(n))}${n.unsicher?" *":""} ${st}</span></div>
        <div class="tr"><div class="bd ${n.stufe}" style="left:${a}%;width:${Math.max(1.5,b-a)}%"></div></div></div>`;
    }).join("")}
    <div class="axis"><span>${fmtN(lo)}</span><span>${esc(einheit)}</span><span>${fmtN(hi)}</span></div>
  </div>`;
}
function histTable(verlauf, einheit, valFn){
  return `<table class="hist">${[...verlauf].reverse().map(p=>{ const d=valFn(p)[0], v=valFn(p)[1];
    return `<tr><td>${fmtDate(d)}</td><td><span class="chip src labor">${esc(labFor(d))}</span></td><td>${num(v)} ${esc(einheit)}</td></tr>`; }).join("")}</table>`;
}
function spark(w){
  const pts = w.verlauf; if(pts.length<2) return "";
  const ref = (w.normen.filter(n=>n.typ==="labor")).slice(-1)[0];
  const Wd=300,H=60,pad=8, vals=pts.map(p=>p[1]);
  const lo=Math.min(...vals, ref?ref.min:Infinity)*0.95, hi=Math.max(...vals, ref?ref.max:-Infinity)*1.05;
  const t0=dt(pts[0][0]).getTime(), t1=dt(pts[pts.length-1][0]).getTime();
  const X=d=>pad+(dt(d).getTime()-t0)/(t1-t0||1)*(Wd-2*pad), Y=v=>H-pad-(v-lo)/(hi-lo)*(H-2*pad);
  const path=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const band = ref ? `<rect x="0" y="${Y(ref.max).toFixed(1)}" width="${Wd}" height="${Math.max(0,Y(ref.min)-Y(ref.max)).toFixed(1)}" fill="var(--lab)" opacity=".15"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Verlauf ${esc(w.name)}">${band}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${i===pts.length-1?5:3.2}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}</svg>`;
}

  <h3 class="sec" style="margin-top:0">Meine Einordnung <span class="meta" style="text-transform:none;letter-spacing:0">· Stand ${fmtDate(E.stand)}</span></h3>
  <section class="card">
    <p class="meta" style="margin-bottom:10px">${esc(E.hinweis)}</p>
    ${E.fazit.map(f=>`<p style="margin-bottom:8px">${esc(f)}</p>`).join("")}
    <div class="scroll"><table class="t" style="margin-top:8px"><tr><th>Wert</th><th>Mein Wert</th><th>Nach meinen Zielwerten</th></tr>
      ${E.werte.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</table></div>
    <div class="scroll"><table class="t" style="margin-top:14px"><tr><th>Ursache laut Kompass</th><th>Meine Daten</th><th>Status</th></tr>
      ${E.ursachen.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</table></div>
  </section>
  <h3 class="sec">${esc(K.titel)} <span class="chip src extern" style="margin-left:6px">${esc(K.quelle)}</span></h3>
  <p class="meta" style="margin-bottom:12px">${esc(K.hinweis)}</p>
  <div class="grid">${muster.map(m=>`<article class="card ${m.passt==="nah"?"nah":""}">
    <div class="row"><span class="pill ${passt[m.passt][1]}">${passt[m.passt][0]}</span></div>
    <h3>${esc(m.zustand)}</h3>${m.info?`<div class="meta">${esc(m.info)}</div>`:""}
    <div class="vals">${dot("TSH",m.tsh)}${dot("fT4",m.ft4)}${dot("fT3",m.ft3)}</div>
    <div class="lbl">Ursachen und fehlende Stoffe</div><ul class="plain">${m.ursachen.map(u=>`<li>${esc(u)}</li>`).join("")}</ul>
    <div class="lbl">Symptome</div><p>${esc(m.symptome)}</p>
    <div class="lbl">Bei mir</div><p>${esc(m.passtText)}</p></article>`).join("")}</div>`;
}
function viewPersonen(){
  return `<h2>Personen</h2><p class="lead">Menschen und Quellen mit Kontakt, nach Rubrik.</p>
  ${D.personen.map((g,i)=>`<h3 class="sec" style="margin-top:${i?30:0}px">${esc(g.gruppe)}</h3>
    <div class="grid">${g.eintraege.map(p=>`<article class="card"><h3>${esc(p.name)}</h3>${p.info?`<div class="meta">${esc(p.info)}</div>`:""}
      ${p.email?`<div class="lbl">E-Mail</div><p class="mail">${esc(p.email)}</p>`:""}
      ${p.notiz?`<div class="lbl">Notiz</div><p>${esc(p.notiz)}</p>`:""}</article>`).join("")}</div>`).join("")}`;
}
const VIEWS = {wissen:viewWissen,personen:viewPersonen,daily:viewDaily,arzt:viewArzt,uebersicht:viewUebersicht,symptome:viewSymptome,supplemente:viewSupp,plan:viewPlan,werte:viewWerte,recherche:viewRecherche};
function render(){
  if(!VIEWS[tab]) tab="uebersicht";
  $("#sub").textContent = D.titel + " · Stand " + fmtDate(D.stand);
  $("#tabs").innerHTML = TABS.map(([id,l])=>`<button role="tab" aria-selected="${id===tab}" data-tab="${id}">${l}</button>`).join("");
  renderStats();
  $("#view").innerHTML = VIEWS[tab]();
}
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-tab]"); if(t){ tab=t.dataset.tab; location.hash=tab; render(); }
});
document.addEventListener("change", e=>{
  const aid=e.target.dataset?.antwort;
  if(aid){ const a=store.get("antwort",{})||{}; a[aid]=e.target.value; store.set("antwort",a); return; }
  const day=e.target.dataset?.day;
  if(day){ const s=new Set(store.get(dayKey(),[])); e.target.checked ? s.add(day) : s.delete(day); store.set(dayKey(),[...s]); render(); return; }
  const id=e.target.dataset?.step; if(!id) return;
  e.target.checked ? done.add(id) : done.delete(id);
  store.set("done",[...done]); render();
});
window.addEventListener("hashchange",()=>{ if(!D) return; tab=location.hash.slice(1); render(); window.scrollTo(0,0); });
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const e = await (await fetch("data.enc.json")).json();
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(e.salt), iterations:e.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct));
  D = JSON.parse(new TextDecoder().decode(pt));
  D.plan.todos.forEach(()=>{});
  $("#lock").hidden = true; $("#app").hidden = false; render();
}
$("#lockForm").addEventListener("submit", async ev => {
  ev.preventDefault(); const msg = $("#lockMsg"); msg.textContent = "Prüfe …";
  try { await unlock($("#pw").value); $("#pw").value = ""; msg.textContent = ""; }
  catch { msg.textContent = "Falsches Passwort."; }
});
</script>
